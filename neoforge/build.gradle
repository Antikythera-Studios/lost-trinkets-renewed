plugins {
    id "com.gradleup.shadow"
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

dependencies {
    neoForge "net.neoforged:neoforge:${project.neoforge_version}"

    api "dev.architectury:architectury-neoforge:${project.architectury_version}"

    common(project(path: ":common")) { transitive false }
    shadowBundle project(path: ":common", configuration: "transformProductionNeoForge")

    compileOnly("mezz.jei:jei-${project.mc_version}-neoforge-api:${project.jei_version}") { transitive false }

    compileOnly("top.theillusivec4.curios:curios-neoforge:${project.curios_neoforge_version}:api") { transitive false }
}

processResources {
    inputs.property "version", project.version
    inputs.property "neoForgeVersion", project.neoforge_version
    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.version,
               "neoForgeVersion": project.neoforge_version
    }
    from project(":common").sourceSets.main.resources, {
        include "resourcepacks/**"
    }
}

jar {
    archiveClassifier = "raw"
}

// MC 26.1+ is unobfuscated: loom-no-remap has no remapJar, so shadowJar is the primary artifact.
// It must build on top of the (Loom-modified) jar output, not the raw source set.
shadowJar {
    dependsOn(jar)
    mainSpec.sourcePaths.clear()
    from(zipTree(jar.archiveFile))

    exclude "fabric.mod.json"
    exclude "architectury.common.json"

    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "neoforge"
}

// Make the shadow jar the published/consumed artifact in place of the removed remapJar.
configurations {
    apiElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
    runtimeElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
}

sourcesJar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}
