plugins {
    id "com.github.johnrengelman.shadow"
}

architectury {
    platformSetupLoomIde()
    forge()
}

loom {
    forge {
        mixinConfig "${project.mod_id}.mixins.json"
        mixinConfig "${project.mod_id}.forge.mixins.json"
    }
    mixin {
        defaultRefmapName = "${project.mod_id}.forge.refmap.json"
    }
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
}

dependencies {
    forge "net.minecraftforge:forge:${project.mc_version}-${project.forge_version}"

    modApi "dev.architectury:architectury-forge:${project.architectury_version}"

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionForge")) { transitive false }

    // JEI (compile-only; runtimeOnly disabled to avoid version conflicts in dev)
    compileOnly("mezz.jei:jei-${project.mc_version}-forge-api:${project.jei_version}") { transitive false }

    // Curios (compile-only; runtimeOnly disabled to avoid version conflicts in dev)
    compileOnly("top.theillusivec4.curios:curios-forge:${project.curios_version}:api") { transitive false }
}

processResources {
    inputs.property "forgeVersion", project.forge_version
    filesMatching("META-INF/mods.toml") {
        expand "version": project.version,
               "forgeVersion": project.forge_version
    }
    from project(":common").sourceSets.main.resources, {
        include "resourcepacks/**"
    }
}

shadowJar {
    exclude "fabric.mod.json"
    exclude "architectury.common.json"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = "dev-shadow"
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier = null
}

jar {
    archiveClassifier = "dev"
}

sourcesJar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}
