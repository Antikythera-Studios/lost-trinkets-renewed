plugins {
    id "com.gradleup.shadow"
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

dependencies {
    implementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    api "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    api "dev.architectury:architectury-fabric:${project.architectury_version}"

    implementation "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${project.forge_config_api_port_version}"

    common(project(path: ":common")) { transitive false }
    shadowBundle project(path: ":common", configuration: "transformProductionFabric")

    compileOnly("mezz.jei:jei-${project.mc_version}-fabric-api:${project.jei_version}") { transitive false }
}

processResources {
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
    from project(":common").sourceSets.main.resources, {
        include "resourcepacks/**"
    }
}

jar {
    archiveClassifier = "raw"
}

// MC 26.1+ is unobfuscated: loom-no-remap has no remapJar, so shadowJar is the primary artifact.
// It must build on top of the (Loom-modified) jar output, not the raw source set.
shadowJar {
    dependsOn(jar)
    mainSpec.sourcePaths.clear()
    from(zipTree(jar.archiveFile))

    exclude "META-INF/neoforge.mods.toml"
    exclude "architectury.common.json"

    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "fabric"
}

// Make the shadow jar the published/consumed artifact in place of the removed remapJar.
configurations {
    apiElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
    runtimeElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
}

sourcesJar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}
